<!DOCTYPE html>
<style>
     .container-main h1 {
        color: orange;
        text-align: center;
     }

     .container-main .content {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
     }

     .container-main .content .product {
        display: flex;
     }

     .container-main .content .product .info {
        /* align-self: flex-end; */
        margin-left: 10pt;
     }
     
     .container-main .content .product .info > *:first-child {
        margin-top: 0;
     }

     .container-main .content .product .div-img img {
        width: 250px;
     }

     hr {
        border: none;
        height: 1px;
        background: linear-gradient(to right, transparent, #e0e0e0, transparent);
        margin: 30px 0;
    }


    html, body {
        height: 100%;
        margin: 0;
        padding: 0px 80px;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    .container-main {
        /* Giữ chiều cao theo nội dung thực tế */
        flex-shrink: 0; 
    }

   footer {
        text-align: center;
        flex: 1; /* Chiếm chiều cao còn lại của body */
        display: flex;
        flex-direction: column; /* Xếp các phần tử con theo chiều dọc */
        justify-content: flex-end; /* Đẩy khối con xuống sát đáy */
        align-items: center; /* Căn giữa khối con theo chiều ngang */
    }
</style>
